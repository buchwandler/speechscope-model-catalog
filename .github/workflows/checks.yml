name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/verify_catalog.py
      - run: python -m unittest discover -s tests -v
      - run: |
          if find . -type f \( -name '*.onnx' -o -name '*.safetensors' -o -name '*.bin' -o -name '*.gguf' -o -name '*.wav' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'binary model/audio asset committed to catalog repository' >&2
            exit 1
          fi
